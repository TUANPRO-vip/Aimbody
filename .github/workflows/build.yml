name: Build TSX AIM BODY APK

"on":
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Find Android project
    shell: bash
    run: |
      PROJECT_DIR="$(find . -name settings.gradle -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Cannot find settings.gradle"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Found project at: $PROJECT_DIR"

  - name: Build debug APK
    run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: TSX-AIM-BODY-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
